name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test menu_test.js
      - run: go vet ./...
      - run: go test -race ./...
      - run: mkdir -p ../dist
      - run: go build -buildmode=c-shared -o ../dist/provider-rate-limiter-${{ matrix.os }} .
